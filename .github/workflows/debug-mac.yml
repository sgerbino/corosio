name: debug-mac

on:
  push:
    branches: [debug/macos-hang]

jobs:
  mac:
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        ref: [fa38b92e917306ff8a882a83d6285f2e7bf23abf]
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          path: corosio-root
          ref: ${{ matrix.ref }}
          fetch-depth: 0

      - id: capy-ref
        uses: ./corosio-root/.github/actions/resolve-capy

      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.capy-ref.outputs.repo }}
          ref: ${{ steps.capy-ref.outputs.ref }}
          path: capy-root

      - uses: alandefreitas/cpp-actions/boost-clone@v1.9.0
        with:
          branch: develop
          boost-dir: boost-source
          modules-exclude-paths: ''
          scan-modules-dir: corosio-root
          scan-modules-ignore: corosio, capy

      - name: Patch Boost
        shell: bash
        run: |
          set -xe
          rm -rf boost-source/libs/corosio boost-source/libs/capy
          cp -rL boost-source boost-root
          cp -r corosio-root boost-root/libs/corosio
          cp -r capy-root boost-root/libs/capy

      - name: Create vcpkg.json
        shell: bash
        run: |
          cat > corosio-root/vcpkg.json << 'EOF2'
          {
            "name": "boost-corosio-deps",
            "version": "1.0.0",
            "dependencies": ["wolfssl"]
          }
          EOF2

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgGitCommitId: bd52fac7114fdaa2208de8dd1227212a6683e562
          vcpkgJsonGlob: '**/corosio-root/vcpkg.json'
          runVcpkgInstall: true

      - name: Build
        shell: bash
        run: |
          inst=$(find "$GITHUB_WORKSPACE" -type d -path "*/vcpkg_installed/arm64-osx" | head -1)
          echo "wolfssl from $inst"
          cmake -S boost-root -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS=--coverage -DCMAKE_C_FLAGS=--coverage \
            -DWolfSSL_INCLUDE_DIR=$inst/include -DWolfSSL_LIBRARY=$inst/lib/libwolfssl.a \
            -DBOOST_INCLUDE_LIBRARIES=corosio -DBOOST_COROSIO_BUILD_TESTS=ON \
            -DBUILD_TESTING=ON -DBOOST_COROSIO_BUILD_BENCH=OFF
          cmake --build build --target boost_corosio_tests boost_corosio_fault_tests -j 4

      - name: Full ctest in parallel with a hang watchdog
        shell: bash
        run: |
          (
            while true; do
              sleep 30
              ps -axo pid=,etime=,command= | grep -E "boost_corosio_(fault_)?tests" | grep -v grep | while read pid et cmd; do
                # etime is [[dd-]hh:]mm:ss; flag anything past 4 minutes
                mins=$(echo "$et" | awk -F'[-:]' '{ if (NF==2) print $1; else if (NF==3) print $1*60+$2; else print 9999 }')
                if [ "$mins" -ge 4 ] && [ ! -e "/tmp/dumped-$pid" ]; then
                  touch "/tmp/dumped-$pid"
                  echo "##### HUNG pid=$pid etime=$et cmd=$cmd"
                  sudo lldb -p $pid --batch -o "thread backtrace all" 2>&1 | head -800
                fi
              done
            done
          ) &
          wd=$!
          ctest --test-dir build --parallel 3 --timeout 600 --output-on-failure 2>&1 | tail -80 || true
          kill $wd || true
